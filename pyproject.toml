[tool.poetry]
package-mode = false

[project]
name = "course-work-3"
version = "0.1.0"
description = "Учебный курсовой проект № 3 по созданию и работе с базами данных"
authors = [
    {name = "Romanovatm",email = "m10021994r@gmail.com"}
]
requires-python = "^3.14"
dependencies = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "psycopg2 (>=2.9.13,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "mypy (>=2.3.1,<3.0.0)"
]

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 119
skip = [".venv", ".git", "build"]
ensure_newline_before_comments = true

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = ['venv','tests']
ignore_missing_imports = true
pretty = true
